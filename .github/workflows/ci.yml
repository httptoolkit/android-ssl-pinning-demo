name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Runner images only preinstall a handful of NDKs, and drop old ones over time. Installing
      # ours explicitly means that when it ages out we get a download, not a silently unstripped APK:
      - name: Install the NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Android files
        run: flutter pub get
        working-directory: flutter_module

      - name: Build release
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # Stripping fails silently, so check the built APK rather than trusting the config:
      - name: Check native debug symbols were stripped
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile

          apk, = glob.glob('app/build/outputs/apk/release/app-*.apk')
          lib = 'lib/arm64-v8a/libflutter.so'
          size = zipfile.ZipFile(apk).getinfo(lib).file_size
          print(f'{lib}: {size / 1e6:.1f} MB')

          # Stripped it is ~11MB, unstripped ~165MB, so this threshold isn't a close call:
          if size > 32_000_000:
              sys.exit(f'{lib} was not stripped - is the NDK from app/build.gradle installed?')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/release/app-*.apk
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Get the APK
        id: get_apk
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Publish the APK to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          prerelease: true
          asset_name: pinning-demo.apk
          file: ${{ steps.get_apk.outputs.download-path }}/app-release.apk
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
