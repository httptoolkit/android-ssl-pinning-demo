name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Android files
        run: flutter pub get
        working-directory: flutter_module

      - name: Build release
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/release/app-*.apk
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Get the APK
        id: get_apk
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Publish the APK to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          prerelease: true
          asset_name: pinning-demo.apk
          file: ${{ steps.get_apk.outputs.download-path }}/app-release.apk
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
