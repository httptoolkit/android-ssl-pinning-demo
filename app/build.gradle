plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def keyStorePassword = System.getenv('KEYSTORE_PASSWORD')
def keyAvailable = !!keyStorePassword

android {
    compileSdkVersion 36

    // AGP strips native debug symbols using this NDK, but if it isn't installed it skips stripping
    // silently rather than failing. Flutter ships libflutter.so unstripped at ~165MB per ABI, so
    // that quietly turns a 60MB APK into a 490MB one. Keep this matched to the Flutter SDK's own
    // flutter.ndkVersion, and see the strip check in CI, which catches it if this drifts again.
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "tech.httptoolkit.pinning_demo"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 13
        versionName "1.7.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Flutter doesn't support x86 (32-bit), but cronet-embedded includes x86 native
        // libs. Without this filter, x86 devices pick the incomplete x86 directory and
        // then crash because libflutter.so is missing.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file("./keystore.jks")
            storePassword keyStorePassword
            keyAlias "signing_key"
            keyPassword keyStorePassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keyAvailable) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('No signing key available')
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'tech.httptoolkit.pinning_demo'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.datatheorem.android.trustkit:trustkit:1.1.5'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.appmattus.certificatetransparency:certificatetransparency-android:2.8.20'
    implementation 'org.chromium.net:cronet-embedded:143.7445.0'

    implementation project(':flutter')
}
